name: local-ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  dbt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Generate and load synthetic extracts
        run: |
          python scripts/generate_raw_data.py
          python scripts/load_raw.py --duckdb-path target/ci.duckdb
      - name: Find malformed Jinja file
        shell: bash
        run: |
          echo "=== Commit being tested ==="
          git rev-parse HEAD

          echo "=== All files containing Jinja block syntax ==="
          grep -RInE --include='*.sql' --include='*.yml' --include='*.yaml' \
            '\{%[-]?[[:space:]]*(if|elif|else|endif|for|endfor|macro|endmacro|test|endtest)' \
            . \
            --exclude-dir=.git \
            --exclude-dir=.venv \
            --exclude-dir=target \
            || true

      - name: Run dbt parse with debug output
        env:
          DBT_PROFILES_DIR: ${{ github.workspace }}
        run: |
          dbt deps --target ci
          dbt parse --target ci --debug 2>&1 | tee dbt-parse-debug.log
        continue-on-error: true

      - name: Upload dbt diagnostic logs
        uses: actions/upload-artifact@v4
        with:
          name: dbt-parse-diagnostics
          path: |
            dbt-parse-debug.log
            logs/dbt.log

      - name: Stop after diagnostics
        run: exit 1
