name: local-ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  dbt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate and load synthetic extracts
        run: |
          python scripts/generate_raw_data.py
          python scripts/load_raw.py --duckdb-path target/ci.duckdb

      - name: Run dbt
        env:
          DBT_PROFILES_DIR: ${{ github.workspace }}
        run: |
          dbt deps --target ci
          dbt seed --target ci
          dbt run --target ci
          dbt test --target ci
